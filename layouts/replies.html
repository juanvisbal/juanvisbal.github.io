<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta ht-include="fragments/site/head">
  <meta ht-include="fragments/site/meta">
  <meta ht-include="fragments/blog/head">
  <link ht-apply rel="stylesheet" href="/stylesheets/pages.css?v=${ env.version, build.id }">
  <link ht-apply rel="stylesheet" href="/stylesheets/blog.css?v=${ env.version, build.id }">
</head>
<body class="content-page">
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="container blog-page">
    <header class="profile">
      <img src="/images/profile.png" alt="" class="profile-pic">
      <nav ht-include="fragments/site/nav"></nav>
    </header>
    <div id="content" tabindex="-1"></div>
    <main id="blog-replies">
      <header>
        <h2 ht-apply>${ page.title }</h2>
        <div class="description">
          <p ht-apply ht-if="${ page.note }" class="p-note">${ page.note }</p>
          <p ht-include="fragments/blog/subnav"></p>
        </div>
      </header>
      <ol class="post-list">
        <li ht-each="reply in ${ data.blog.replies }">
          <div ht-apply class="post-body">${ reply.content_html }</div>
          <p class="post-date"><a ht-apply href="${ reply.url }"><span aria-hidden="true">→ </span><time ht-apply datetime='${ datefmt(reply.date_published, "yyyy-MM-ddTHH:mm:ssZZZZZ", "-05:00") }'>${ datefmt(reply.date_published, "MMM d, yyyy", "-05:00") }<span aria-hidden="true"> ·</span> ${ datefmt(reply.date_published, "h:mm a", "-05:00") }</time></a></p>
        </li>
      </ol>
    </main>
    <nav class="back-link" aria-label="Back"><a href="/blog/">← All posts</a></nav>
    <hr class="section-separator">
    <footer ht-include="fragments/site/footer"></footer>
  </div>
  <script ht-include="fragments/site/scripts"></script>
</body>
</html>
