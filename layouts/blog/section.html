{{ define "main" }}
    <main id="blog" class="h-feed">
      <header>
        <h2 class="p-name">{{ .Title }}</h2>
        <div class="description">
          <p class="p-note">{{ .Description }}</p>
          {{ partial "blog/subnav.html" . }}
        </div>
      </header>

      <ol class="post-list">
        {{- range where site.RegularPages "Layout" "post" }}
        <li class="h-entry">
          {{ partial "blog/entry.html" (dict "page" . "list" true) }}
        </li>
        {{- end }}
      </ol>
    </main>
{{ end }}
