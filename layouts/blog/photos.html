{{ define "main" }}
    <main id="blog-photos">
      {{ partial "site/page-header.html" (dict "page" .) }}
      <div class="photo-grid">
        {{- range partial "blog/all-posts.html" . }}
        {{- $p := . }}
        {{- with partial "blog/first-image.html" . }}
        <a href="{{ $p.RelPermalink }}"><img src="{{ . }}" alt="{{ $p.Title | default ($p.Summary | plainify | htmlUnescape | truncate 80) }}" loading="lazy" /></a>
        {{- end }}
        {{- end }}
      </div>
    </main>
{{ end }}
