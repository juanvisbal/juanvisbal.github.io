<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta ht-include="fragments/site/head">
  <meta ht-include="fragments/site/meta">
  <link ht-apply rel="stylesheet" href="/stylesheets/pages.css?v=${ env.version, build.id }">
  <link ht-apply rel="stylesheet" href="/stylesheets/profile.css?v=${ env.version, build.id }">
</head>
<body class="content-page">
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="container about-page h-card">
    <header class="profile">
      <img src="/images/profile.png" alt="" class="profile-pic u-photo">
      <nav ht-include="fragments/site/nav"></nav>
    </header>
    <div id="content" tabindex="-1"></div>
    <main id="about" class="e-content">
      <header>
        <h2 ht-apply>${ page.title }</h2>
        <div class="description">
          <p ht-apply ht-if="${ page.note }" class="p-note">${ page.note }</p>
          <p>
            Also in Markdown at <a href="/.well-known/about.md">/.well-known/about.md</a>, for apps that read <a href="https://aboutspec.org/">AboutSpec</a>.
          </p>
        </div>
      </header>

      <p ht-apply>${ data.home.bio }</p>

      <h3>Links</h3>
      <ul class="profile-list">
        <li ht-each="link in ${ data.home.links }"><a ht-apply href="${ link.url }">${ link.name }</a></li>
      </ul>

      <h3>Elsewhere</h3>
      <ul class="profile-list">
        <li ht-each="item in ${ data.home.elsewhere }" ht-if='${ item.url } !~ "^mailto:"'><a ht-apply href="${ item.url }" rel='${ item.rel, "" }'>${ item.name }</a></li>
        <li ht-each="item in ${ data.home.elsewhere }" ht-if='${ item.url } ~= "^mailto:"'><a ht-apply href="${ item.url }">${ item.name }</a></li>
      </ul>

      <p class="content-footnote">He/They · 🏳️‍🌈 · Bogotá, Colombia</p>
    </main>
    <nav class="back-link" aria-label="Back"><a href="/">← Home</a></nav>
    <hr class="section-separator">
    <footer ht-include="fragments/site/footer"></footer>
  </div>
  <script ht-include="fragments/site/scripts"></script>
</body>
</html>
