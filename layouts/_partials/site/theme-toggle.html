<button type="button" class="theme-toggle" hidden>
        <span class="theme-toggle__to-dark"><i class="fa-solid fa-moon" aria-hidden="true"></i><span class="visually-hidden">Switch to dark theme</span></span>
        <span class="theme-toggle__to-light"><i class="fa-solid fa-sun" aria-hidden="true"></i><span class="visually-hidden">Switch to light theme</span></span>
        <span class="theme-toggle__to-system"><i class="fa-solid fa-desktop" aria-hidden="true"></i><span class="visually-hidden">Use system theme</span></span>
      </button>
      {{ partial "site/js.html" "theme.js" }}
