<button type="button" class="theme-toggle" hidden>
        <span class="theme-toggle__to-dark"><i class="fa-solid fa-moon" aria-hidden="true"></i><span class="visually-hidden">{{ i18n "themeToDark" }}</span></span>
        <span class="theme-toggle__to-light"><i class="fa-solid fa-sun" aria-hidden="true"></i><span class="visually-hidden">{{ i18n "themeToLight" }}</span></span>
        <span class="theme-toggle__to-system"><i class="fa-solid fa-desktop" aria-hidden="true"></i><span class="visually-hidden">{{ i18n "themeToSystem" }}</span></span>
      </button>
      {{ partial "site/js.html" "theme.js" }}
