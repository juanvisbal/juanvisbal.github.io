<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta ht-include="fragments/site/head">
  <meta ht-include="fragments/site/meta">
  <link ht-apply rel="stylesheet" href="/stylesheets/pages.css?v=${ env.version, build.id }">
  <link ht-apply rel="stylesheet" href="/stylesheets/profile.css?v=${ env.version, build.id }">
</head>
<body class="content-page">
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="container contact-page h-card">
    <header class="profile">
      <img src="/images/profile.png" alt="" class="profile-pic u-photo">
      <nav ht-include="fragments/site/nav"></nav>
    </header>
    <div id="content" tabindex="-1"></div>
    <main id="contact" class="e-content">
      <header>
        <h2 ht-apply>${ page.title }</h2>
        <div class="description">
          <p ht-apply ht-if="${ page.note }" class="p-note">${ page.note }</p>
          <p>
            Add me to your contacts: <a href="/.well-known/contact.vcf">contact.vcf</a> (<a href="https://contactspec.org/">ContactSpec</a>).
          </p>
        </div>
      </header>

      <ul class="profile-list">
        <li ht-each="item in ${ data.home.elsewhere }" ht-if='${ item.url } ~= "^mailto:"'>${ item.name } <span>·</span> <a ht-apply href="${ item.url }" class="u-email">${ bare_url(item.url) }</a></li>
        <li>Website <span>·</span> <a ht-apply href="${ site.base_url }/" class="u-url">${ bare_url(site.base_url) }</a></li>
        <li ht-each="item in ${ data.home.elsewhere }" ht-if='${ item.url } !~ "^mailto:"'>${ item.name } <span>·</span> <a ht-apply href="${ item.url }" rel='${ item.rel, "" }'>${ bare_url(item.url) }</a></li>
      </ul>
    </main>
    <nav class="back-link" aria-label="Back"><a href="/">← Home</a></nav>
    <hr class="section-separator">
    <footer ht-include="fragments/site/footer"></footer>
  </div>
  <script ht-include="fragments/site/scripts"></script>
</body>
</html>
