baseURL = "https://juanvisbal.com/"
title = "Juan Visbal"
defaultContentLanguage = "en"
# Blog posts and replies stay English-only; Spanish covers the main pages and
# the site chrome. Untranslated pages simply don't exist on /es/.
# Root keys must stay above the [languages]/[menus] tables (TOML scoping).
enableRobotsTXT = true
disableHugoGeneratorInject = true
disableKinds = ["taxonomy", "term"]
rssLimit = 25

[languages.en]
  locale = "en"
  label = "English"
  weight = 1
  [languages.en.params]
    resumePdf = "/resume.pdf"

[languages.es]
  locale = "es-CO"
  label = "Español"
  weight = 2
  [languages.es.params]
    resumePdf = "/es/resume.pdf"

[pagination]
  pagerSize = 25

[markup.goldmark.renderer]
  unsafe = true

# Every /blog/ page: main-site layout plus the blog stylesheet.
[[cascade]]
  [cascade.params]
    stylesheet = "blog.css"
    container_class = "blog-page"
  [cascade.target]
    path = "{/blog,/blog/**}"

# Blog posts: content/blog/YYYY/MM/DD/<slug>.md, served at /blog/YYYY/MM/DD/<slug>.html.
[[cascade]]
  layout = "post"
  [cascade.target]
    path = "{/blog/20[0-9][0-9]/**}"

[mediaTypes."application/json"]
  suffixes = ["json"]
[mediaTypes."text/x-opml"]
  suffixes = ["opml"]
[mediaTypes."text/vcard"]
  suffixes = ["vcf"]

[outputFormats.RSS]
  baseName = "feed"
  notAlternative = true
[outputFormats.JSON]
  baseName = "feed"
  notAlternative = true
[outputFormats.ArchiveJSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true
[outputFormats.PhotosJSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true
# Markdown copy of each main-site page (/now.html -> /now.md)
[outputFormats.markdown]
  mediaType = "text/markdown"
  isPlainText = true
  rel = "alternate"
[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true
[outputFormats.opml]
  mediaType = "text/x-opml"
  isPlainText = true
  rel = "alternate"
# SocialSpec (socialspec.org) APIs, all on the home page. Headers: static/_headers.
# AboutSpec (aboutspec.org) and ContactSpec (contactspec.org): /.well-known/about.md and
# /.well-known/contact.vcf, from the home page's front matter. FollowSpec (followspec.org):
# /.well-known/following.opml, the blogroll (assets/blogroll.opml).
[outputFormats.aboutspec]
  mediaType = "text/markdown"
  path = ".well-known"
  baseName = "about"
  isPlainText = true
  notAlternative = true
[outputFormats.contactspec]
  mediaType = "text/vcard"
  path = ".well-known"
  baseName = "contact"
  isPlainText = true
  notAlternative = true
[outputFormats.following]
  mediaType = "text/x-opml"
  path = ".well-known"
  baseName = "following"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "markdown", "llms", "aboutspec", "contactspec", "following"]
  section = ["HTML"]
  page = ["HTML"]

# Menu URLs are language-neutral page paths; nav.html resolves them with site.GetPage,
# which returns the current language's page (or the English-only pages, which are
# en-only: the blog, and /about.html on the Spanish site until it is translated).
[languages.en.menus]
  [[languages.en.menus.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[languages.en.menus.main]]
    name = "About"
    url = "/about.html"
    weight = 2
  [[languages.en.menus.main]]
    name = "Blog"
    url = "/blog/"
    weight = 3
  [[languages.en.menus.main]]
    name = "Now"
    url = "/now.html"
    weight = 4
  [[languages.en.menus.main]]
    name = "Resume"
    url = "/resume.html"
    weight = 5
  [[languages.en.menus.main]]
    name = "Blogroll"
    url = "/blogroll.html"
    weight = 6

[languages.es.menus]
  [[languages.es.menus.main]]
    name = "Inicio"
    url = "/"
    weight = 1
  [[languages.es.menus.main]]
    name = "Sobre mí"
    url = "/about.html"
    weight = 2
  [[languages.es.menus.main]]
    name = "Blog"
    url = "/blog/"
    weight = 3
  [[languages.es.menus.main]]
    name = "Ahora"
    url = "/now.html"
    weight = 4
  [[languages.es.menus.main]]
    name = "Currículum"
    url = "/resume.html"
    weight = 5
  [[languages.es.menus.main]]
    name = "Blogroll"
    url = "/blogroll.html"
    weight = 6

[params]
  # rel="me" links on every page (identity for IndieAuth, RelMeAuth, webmention.io, the webring)
  me = ["https://juanvisbal.com/", "https://bsky.app/profile/juanvisbal.com", "https://social.lol/@juan"]
  # Webmention receiver (sign in at https://webmention.io with juanvisbal.com first)
  webmention = "https://webmention.io/juanvisbal.com/webmention"
  # IndieWeb Webring (https://xn--sr8hvo.ws/): uncomment and paste the links from your dashboard
  # after joining.
  # [params.webring]
  #   previous = "https://xn--sr8hvo.ws/<id>/previous"
  #   home = "https://xn--sr8hvo.ws/<id>"
  #   next = "https://xn--sr8hvo.ws/<id>/next"
  bluesky_publication = "at://did:plc:oe7zju6lj6ggta4rfpqq6mzy/site.standard.publication/3mnijwuss6v2n"

  [params.blog]
    # Feed title; the section itself is just "Blog" (content/blog/_index.md)
    title = "Juan Visbal · Blog"

  [params.author]
    name = "Juanse Visbal"
    avatar = "/blog/avatar.jpg"
    url = "https://juanvisbal.com/"

# /now.html, /now.md, /blogroll.opml (sections like /blog/ keep index.html)
[uglyURLs]
  "" = true
  blog = false
