<meta name="color-scheme" content="light dark">
<script>try{document.querySelector('meta[name="color-scheme"]').content=localStorage.getItem("color-scheme")??"light dark"}catch(e){}</script>
<link ht-apply rel="stylesheet" href="/stylesheets/tokens.css?v=${ env.version, build.id }">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicons/favicon-16x16.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="human-json" href="/human.json">
<link ht-apply rel="alternate" type="application/rss+xml" title="${ site.blog.title }" href="${ site.base_url }/blog/feed.xml">
<link ht-apply rel="alternate" type="application/feed+json" title="${ site.blog.title }" href="${ site.base_url }/blog/feed.json">
<link ht-apply rel="alternate" type="application/atom+xml" title="${ site.blog.title }" href="${ site.base_url }/blog/atom.xml">
<link ht-apply ht-if="${ page.opml }" rel="alternate" type="text/x-opml" title="${ site.title } ${ page.title } OPML" href="${ page.opml }">
<link ht-apply ht-if="${ page.markdown }" rel="alternate" type="text/markdown" title="Markdown version" href="${ page.markdown }">
<link ht-apply rel="stylesheet" href="/stylesheets/styles.css?v=${ env.version, build.id }">
