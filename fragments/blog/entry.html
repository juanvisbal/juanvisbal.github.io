<div ht-apply class="e-content post-body">
  ${ post.body, "" }
</div>
<a ht-apply ht-if="${ post.preview.title }" class="link-preview" href='${ post.preview.url, "" }'>
  <img ht-apply ht-if="${ post.preview.image }" src='${ post.preview.image, "" }' alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">
  <span class="link-preview-text">
    <span ht-apply class="link-preview-host">${ post.preview.host, "" }</span>
    <strong ht-apply class="link-preview-title">${ post.preview.title, "" }</strong>
    <span ht-apply ht-if="${ post.preview.description }" class="link-preview-desc">${ post.preview.description, "" }</span>
  </span>
</a>
<p class="post-date">
  <a ht-apply class="u-url" href="${ post.path }"><span aria-hidden="true">→ </span><time ht-apply class="dt-published" datetime="${ post.created_at }">${ datefmt(post.created_at, "MMM d, yyyy") }<span aria-hidden="true"> ·</span> ${ datefmt(post.created_at, "h:mm a") }</time></a>
</p>
<a ht-apply class="p-author h-card" href="${ site.author.url }" hidden>${ site.title }</a>
<a ht-apply ht-if="${ post.bluesky.link }" class="u-syndication" href='${ post.bluesky.link, "" }' hidden>Bluesky</a>
<a ht-apply ht-if="${ post.mastodon.id }" class="u-syndication" href='https://${ post.mastodon.hostname, "" }/@${ post.mastodon.username, "" }/${ post.mastodon.id, "" }' hidden>Mastodon</a>
